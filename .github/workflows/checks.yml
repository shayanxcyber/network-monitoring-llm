name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/media/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/media/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu tests and interface build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ""
      PACKETPILOT_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ubuntu-verified.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          python -m pip install -r requirements-ubuntu-verified.txt
          npm ci --prefix frontend --no-audit --no-fund
      - name: Backend tests
        run: python -m unittest discover -s components/06-testing-evaluation -p 'test_*.py'
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: Reproduce the shipped interface
        run: |
          sha256sum web/react/assets/* > "$RUNNER_TEMP/interface-assets.sha256"
          npm run build --prefix frontend
          sha256sum --check "$RUNNER_TEMP/interface-assets.sha256"
